# ============================================================
# Reusable configurations
# ============================================================

# Shared observability configuration used by all .NET services.
#
# These hostnames work inside Docker Compose because Docker
# provides DNS using the service names "seq" and "zipkin".
x-observability: &observability
  Observability__SeqUrl: "http://seq:5341"
  Observability__ZipkinUrl: "http://zipkin:9411"


# Shared configuration for all ArticleService instances.
x-article-service: &article-service
  build:
    context: .
    dockerfile: ArticleService/Dockerfile

  environment:
    <<: *observability

    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080

    ConnectionStrings__Africa: "Host=article-db-africa;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__Antarctica: "Host=article-db-antarctica;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__Asia: "Host=article-db-asia;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__Europe: "Host=article-db-europe;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__NorthAmerica: "Host=article-db-north-america;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__SouthAmerica: "Host=article-db-south-america;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__Oceania: "Host=article-db-oceania;Database=articles;Username=postgres;Password=postgres"
    ConnectionStrings__Global: "Host=article-db-global;Database=articles;Username=postgres;Password=postgres"

  depends_on:
    article-db-africa:
      condition: service_healthy

    article-db-antarctica:
      condition: service_healthy

    article-db-asia:
      condition: service_healthy

    article-db-europe:
      condition: service_healthy

    article-db-north-america:
      condition: service_healthy

    article-db-south-america:
      condition: service_healthy

    article-db-oceania:
      condition: service_healthy

    article-db-global:
      condition: service_healthy


# Shared configuration for ArticleService PostgreSQL instances.
x-article-postgres: &article-postgres
  image: postgres:17

  environment:
    POSTGRES_DB: articles
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres

  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
    interval: 5s
    timeout: 5s
    retries: 10


# ============================================================
# Services
# ============================================================

services:

  # ============================================================
  # ArticleService - Nginx load balancer
  # ============================================================

  article-load-balancer:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3


  # ============================================================
  # ArticleService - X-axis split
  # ============================================================

  article-service-1:
    <<: *article-service

  article-service-2:
    <<: *article-service

  article-service-3:
    <<: *article-service


  # ============================================================
  # ArticleService - Z-axis split
  # ============================================================

  article-db-africa:
    <<: *article-postgres

    volumes:
      - article-africa-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-antarctica:
    <<: *article-postgres

    volumes:
      - article-antarctica-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-asia:
    <<: *article-postgres

    volumes:
      - article-asia-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-europe:
    <<: *article-postgres

    volumes:
      - article-europe-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-north-america:
    <<: *article-postgres

    volumes:
      - article-north-america-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-south-america:
    <<: *article-postgres

    volumes:
      - article-south-america-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-oceania:
    <<: *article-postgres

    volumes:
      - article-oceania-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  article-db-global:
    <<: *article-postgres

    volumes:
      - article-global-data:/var/lib/postgresql/data
      - ./database/ArticleInit.sql:/docker-entrypoint-initdb.d/ArticleInit.sql:ro


  # ============================================================
  # CommentService
  # ============================================================

  comment-service:
    build:
      context: .
      dockerfile: CommentService/Dockerfile

    environment:
      <<: *observability

      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=comment-db;Database=comments;Username=postgres;Password=postgres"

      # Direct service-to-service communication.
      ProfanityService__BaseUrl: "http://profanity-service:8080"

    ports:
      - "8081:8080"

    depends_on:
      comment-db:
        condition: service_healthy

    # Deliberately no depends_on for profanity-service.
    #
    # CommentService must be capable of running while
    # ProfanityService is unavailable. The circuit breaker
    # in CommentService handles that failure.
    #
    # There is also deliberately no dependency on Seq or Zipkin.
    # Observability infrastructure going down should not stop
    # the business service from starting.


  # ============================================================
  # CommentDatabase
  # ============================================================

  comment-db:
    image: postgres:17

    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - comment-data:/var/lib/postgresql/data
      - ./database/CommentInit.sql:/docker-entrypoint-initdb.d/CommentInit.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # ProfanityService
  # ============================================================

  profanity-service:
    build:
      context: .
      dockerfile: ProfanityService/Dockerfile

    environment:
      <<: *observability

      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=profanity-db;Database=profanity;Username=postgres;Password=postgres"

    ports:
      - "8082:8080"

    depends_on:
      profanity-db:
        condition: service_healthy


  # ============================================================
  # ProfanityDatabase
  # ============================================================

  profanity-db:
    image: postgres:17

    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - profanity-data:/var/lib/postgresql/data
      - ./database/ProfanityInit.sql:/docker-entrypoint-initdb.d/ProfanityInit.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profanity"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # DraftService
  # ============================================================

  draft-service:
    build:
      context: .
      dockerfile: DraftService/Dockerfile

    environment:
      <<: *observability

      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: "Host=draft-db;Database=drafts;Username=postgres;Password=postgres"

    ports:
      - "8083:8080"

    depends_on:
      draft-db:
        condition: service_healthy


  # ============================================================
  # DraftDatabase
  # ============================================================

  draft-db:
    image: postgres:17

    environment:
      POSTGRES_DB: drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - draft-data:/var/lib/postgresql/data
      - ./database/DraftInit.sql:/docker-entrypoint-initdb.d/DraftInit.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drafts"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # Observability - Seq
  # ============================================================

  seq:
    image: datalust/seq:latest

    container_name: happy-headlines-seq

    environment:
      ACCEPT_EULA: "Y"

      # Development only.
      # Allows access to Seq without configuring authentication.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"

    ports:
      # Seq web interface
      - "5341:80"

    volumes:
      - seq-data:/data


  # ============================================================
  # Observability - Zipkin
  # ============================================================

  zipkin:
    image: ghcr.io/openzipkin-contrib/zipkin-otel:latest

    container_name: happy-headlines-zipkin

    ports:
      # Zipkin UI + OTLP HTTP endpoint
      - "9411:9411"


# ============================================================
# Persistent volumes
# ============================================================

volumes:

  # Article databases
  article-africa-data:
  article-antarctica-data:
  article-asia-data:
  article-europe-data:
  article-north-america-data:
  article-south-america-data:
  article-oceania-data:
  article-global-data:

  # Comment database
  comment-data:

  # Profanity database
  profanity-data:

  # Draft database
  draft-data:

  # Seq
  seq-data: