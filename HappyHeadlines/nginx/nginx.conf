events {}

http {
    # ============================================================
    # Upstreams
    # ============================================================

    # ArticleService is horizontally scaled across three instances.
    upstream article_backend {
        server article-service-1:8080;
        server article-service-2:8080;
        server article-service-3:8080;
    }


    server {
        listen 80;


        # ========================================================
        # ArticleService
        # ========================================================

        location /api/articles {
            proxy_pass http://article_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ========================================================
        # CommentService
        # ========================================================

        location /api/comments {
            proxy_pass http://comment-service:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ========================================================
        # ProfanityService
        # ========================================================

        location /api/profanity {
            proxy_pass http://profanity-service:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ========================================================
        # DraftService
        # ========================================================

        location /api/drafts {
            proxy_pass http://draft-service:8080;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ========================================================
        # OpenAPI documents
        #
        # These URLs are loaded by the central Swagger UI hosted
        # by ArticleService.
        # ========================================================

        location = /openapi/article.json {
            proxy_pass http://article_backend/swagger/v1/swagger.json;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location = /openapi/comment.json {
            proxy_pass http://comment-service:8080/swagger/v1/swagger.json;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location = /openapi/profanity.json {
            proxy_pass http://profanity-service:8080/swagger/v1/swagger.json;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        location = /openapi/draft.json {
            proxy_pass http://draft-service:8080/swagger/v1/swagger.json;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ========================================================
        # Swagger UI
        #
        # ArticleService hosts the Swagger UI.
        # The UI uses the /openapi/*.json endpoints above to show
        # all four services.
        # ========================================================

        location /swagger {
            proxy_pass http://article_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ========================================================
        # Root fallback
        #
        # Anything that does not match one of the routes above is
        # forwarded to ArticleService.
        # ========================================================

        location / {
            proxy_pass http://article_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}